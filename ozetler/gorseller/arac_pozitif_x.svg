<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="800" height="340" fill="#ffffff"/>
  <!-- yol -->
  <rect x="0" y="232" width="800" height="34" fill="#5b6270"/>
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="34 26"><line x1="10" y1="249" x2="790" y2="249"/></g>
  <!-- hız (hareket) çizgileri -->
  <g stroke="#9aa4b5" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="150" x2="215" y2="150"/>
    <line x1="130" y1="178" x2="210" y2="178"/>
    <line x1="160" y1="206" x2="215" y2="206"/>
  </g>
  <!-- araba gövdesi (sağa bakıyor) -->
  <path d="M232,218 L232,178 Q236,162 260,158 L320,154 L360,112 Q368,104 382,104 L478,104 Q494,104 504,114 L548,156 L598,164 Q622,168 626,188 L628,218 Z" fill="#1f5fbf" stroke="#123c7a" stroke-width="3" stroke-linejoin="round"/>
  <!-- camlar -->
  <path d="M338,154 L370,120 Q374,116 382,116 L426,116 L426,154 Z" fill="#cfe4ff" stroke="#123c7a" stroke-width="2"/>
  <path d="M438,116 L478,116 Q488,116 494,122 L528,154 L438,154 Z" fill="#cfe4ff" stroke="#123c7a" stroke-width="2"/>
  <!-- kapı çizgisi ve kolu -->
  <line x1="432" y1="156" x2="432" y2="214" stroke="#123c7a" stroke-width="2"/>
  <rect x="446" y="166" width="20" height="5" rx="2" fill="#123c7a"/>
  <rect x="384" y="166" width="20" height="5" rx="2" fill="#123c7a"/>
  <!-- farlar -->
  <path d="M606,172 L624,176 L625,190 L606,188 Z" fill="#ffe680" stroke="#123c7a" stroke-width="1.5"/>
  <rect x="234" y="176" width="10" height="16" rx="2" fill="#e04b3c"/>
  <!-- tekerlekler -->
  <g>
    <circle cx="300" cy="222" r="30" fill="#222"/><circle cx="300" cy="222" r="13" fill="#c9ced8"/>
    <circle cx="560" cy="222" r="30" fill="#222"/><circle cx="560" cy="222" r="13" fill="#c9ced8"/>
  </g>
  <!-- hız vektörü -->
  <line x1="390" y1="70" x2="545" y2="70" stroke="#b3261e" stroke-width="6"/>
  <polygon points="568,70 540,57 540,83" fill="#b3261e"/>
  <text x="455" y="54" font-size="30" font-style="italic" fill="#b3261e" text-anchor="middle">ϑ</text>
  <line x1="444" y1="25" x2="466" y2="25" stroke="#b3261e" stroke-width="2.5"/>
  <polygon points="470,25 463,21 463,29" fill="#b3261e"/>
  <!-- x ekseni -->
  <line x1="40" y1="300" x2="740" y2="300" stroke="#1d2433" stroke-width="3"/>
  <polygon points="762,300 736,290 736,310" fill="#1d2433"/>
  <polygon points="18,300 44,290 44,310" fill="#1d2433"/>
  <line x1="400" y1="290" x2="400" y2="312" stroke="#1d2433" stroke-width="3"/>
  <text x="400" y="334" font-size="20" text-anchor="middle" fill="#1d2433">x = 0</text>
  <text x="760" y="334" font-size="22" text-anchor="end" fill="#1d2433" font-weight="bold">+x</text>
  <text x="22" y="334" font-size="22" fill="#1d2433" font-weight="bold">–x</text>
</svg>
