      <path d="M-5,24 C-18,15 -22,-5 -14,-16 C-6,-25 11,-24 16,-12 L17,-4 L22,3 C22,5 19,6 17,6 L18,10 L16,12 L17,15 C15,20 10,21 5,20 L3,25 Z" fill="#e3b08a"/>
      <path d="M-16,-12 C-9,-27 13,-27 17,-9 C11,-14 2,-15 -4,-9 C-8,-5 -12,0 -18,4 C-21,-2 -20,-8 -16,-12 Z" fill="#3a281c"/>
